# Keep uploaded logs for this many 24-hour days from server receipt time.
# Override with LOGAN_RETENTION_DAYS or -Dlogan.retention-days; must be positive.
logan.retention-days=${LOGAN_RETENTION_DAYS:3}
# First cleanup runs one minute after startup, then one hour after each run finishes.
logan.retention.initial-delay-ms=60000
logan.retention.cleanup-interval-ms=3600000
